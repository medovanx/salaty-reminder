name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = ([xml](Get-Content SalatyReminder.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $ver) { throw "Tag v$tag does not match <Version>$ver</Version> in SalatyReminder.csproj" }

      - name: Publish single-file exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?s)## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=\n## \[|\n\[\d)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Release $ver" }
          Set-Content notes.md $notes -Encoding utf8

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} publish/SalatyReminder.exe --title "Salaty Reminder ${{ github.ref_name }}" --notes-file notes.md
